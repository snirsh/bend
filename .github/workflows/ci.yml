name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect package.json
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No package.json; skipping install, test, and typecheck."
          fi

      - name: Setup Bun
        if: steps.detect.outputs.present == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: bun install

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: bun test

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        run: bun run typecheck

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: bun run build

      - name: Size budget
        if: steps.detect.outputs.present == 'true'
        run: bun run size

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks v8.30.1
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output gitleaks_8.30.1_linux_x64.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C "$RUNNER_TEMP" gitleaks

      - name: Scan repository history
        run: |
          "$RUNNER_TEMP/gitleaks" detect --source . --verbose --redact --no-banner
